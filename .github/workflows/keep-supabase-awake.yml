# Keeps the free Supabase project behind the Bottle Boy top score board from pausing.
# Supabase pauses free projects after a week without activity, so this reads the
# leaderboard every three days. The key below is the public "publishable" key that
# the game itself already uses; it can only read and add scores.
name: Keep score board awake

on:
  schedule:
    - cron: "17 6 */3 * *"   # every third day at 06:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the top score board
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://azsqriyrikucnsnfpsdq.supabase.co/rest/v1/scores?select=id&limit=1" \
            -H "apikey: sb_publishable_ytGAUoqq_Xc9z28MXEx-LQ_AUxN2fIn")
          echo "Supabase answered with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::The score board did not answer normally (HTTP $status). It may be paused: restore it in the Supabase dashboard."
            exit 1
          fi
