<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bottle Boy</title>
<meta name="description" content="Bottle Boy: an 8-bit tapping game by Tasste of Life Studios. AI took the office jobs, and now everyone works bottle returns.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
html{box-sizing:border-box;height:100%;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: 8-bit console look — black HUD strip, integer-scaled pixel canvas (queue on the left, machines and belts on the right), NES-style text boxes for title, dialogue and end of shift */
:root{
  color-scheme:dark;
  --bg:#000000; --fg:#fcfcfc; --dim:#7c7c7c; --gold:#f8b800; --red:#d82800; --green:#00a800; --blue:#0058f8;
  --pixel:"Press Start 2P","Courier New",ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--pixel);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:4px solid #3c3c3c;font-size:10px}
.hud > div{display:grid;gap:6px}
.hud .k{color:var(--dim);font-size:8px}
.hud .v{color:var(--fg);font-variant-numeric:tabular-nums}
.hud .gold{color:var(--gold)}
.lives{display:flex;gap:2px;height:10px;align-items:center}
.lives i{width:6px;height:8px;background:var(--red);display:block}
.lives i.off{background:#3c3c3c}
.mute{font-family:var(--pixel);font-size:9px;background:#000;color:var(--fg);border:3px solid var(--fg);border-radius:4px;padding:7px 8px;cursor:pointer;flex:none}
.mute[aria-pressed="true"]{color:var(--dim);border-color:var(--dim)}
.mute:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stage{flex:1;position:relative;min-height:0;overflow:hidden;background:var(--bg)}
canvas#c{position:absolute;top:0;left:50%;transform:translateX(-50%);image-rendering:pixelated;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.dim{background:rgba(0,0,0,.72);justify-content:center}
.nesbox{background:#000;color:var(--fg);border:4px solid var(--fg);border-radius:6px;box-shadow:0 0 0 4px #000;padding:14px;width:100%;max-width:420px;box-sizing:border-box}
.dlgbox{display:flex;gap:12px;align-items:flex-start;position:relative;min-height:96px}
#portrait{width:48px;height:36px;image-rendering:pixelated;flex:none;border:2px solid #3c3c3c;background:#24188c}
.dlgtext{min-width:0;flex:1;display:grid;gap:8px}
.who{color:var(--gold);font-size:10px}
#dText{margin:0;font-size:10px;line-height:1.9;min-height:3.8em;overflow-wrap:anywhere}
.more{position:absolute;right:10px;bottom:6px;font-family:system-ui,sans-serif;font-size:12px;color:var(--fg);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.more{animation:none}}
.btn{font-family:var(--pixel);font-size:12px;background:#000;color:var(--fg);border:4px solid var(--fg);border-radius:4px;padding:12px 16px;cursor:pointer}
.btn:hover,.btn:focus-visible{color:var(--gold);border-color:var(--gold);outline:none}
.btn.primary{background:var(--red);border-color:var(--fg)}
.btn.small{font-size:9px;padding:8px 10px;border-width:3px}
.skip{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));z-index:5}
.end h2{font-size:16px;color:var(--red);margin:0 0 14px;line-height:1.4}
.end .money{font-size:22px;color:var(--gold);margin-bottom:14px}
.end p{font-size:9px;line-height:1.9;margin:0 0 10px}
.end .quote{color:var(--fg);border-top:2px dashed #3c3c3c;padding-top:10px}
.end .best{color:var(--dim)}
.diffrow{align-items:center}
.difflabel{font-size:9px;color:var(--dim);width:100%;text-align:center}
.diffbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold);background:#24188c}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<div class="app">
  <div class="hud">
    <div><span class="k">DEPOSITS</span><span class="v gold" id="hMoney">0,00 €</span></div>
    <div><span class="k">CUSTOMERS</span><span class="v" id="hServed">0</span></div>
    <div><span class="k">MISSES</span><span class="lives" id="hLives"></span></div>
    <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">♪ ON</button>
  </div>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Game area"></canvas>

    <div class="overlay" id="title">
      <div class="row">
        <button class="btn primary" id="go" type="button">► START</button>
        <button class="btn small" id="goSkip" type="button">SKIP INTRO</button>
      </div>
    </div>

    <button class="btn small skip" id="skip" type="button" hidden>SKIP ▸▸</button>

    <div class="overlay" id="dlg" hidden>
      <div class="nesbox dlgbox">
        <canvas id="portrait" width="12" height="9"></canvas>
        <div class="dlgtext"><div class="who" id="dWho"></div><p id="dText"></p></div>
        <span class="more" id="dMore">▼</span>
      </div>
    </div>

    <div class="overlay dim" id="end" hidden>
      <div class="nesbox end">
        <h2 id="eTitle">SHIFT OVER</h2>
        <div class="money" id="eMoney">0,00 €</div>
        <p id="eStats"></p>
        <p class="quote" id="eBoss"></p>
        <p class="best" id="eBest"></p>
        <div class="row"><button class="btn primary" id="again" type="button">► NEW SHIFT</button></div>
      </div>
    </div>
  </div>
</div>

<script>
// ---------- canvas & pixel scale ----------
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),stage=document.getElementById("stage");
let S=3,LW=130,LH=220,DPR=1;
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  S=Math.max(2,Math.floor(w/130));LW=Math.floor(w/S);LH=Math.max(160,Math.floor(h/S));
  DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=LW*S*DPR;cv.height=LH*S*DPR;cv.style.width=LW*S+"px";cv.style.height=LH*S+"px";
  ctx.setTransform(S*DPR,0,0,S*DPR,0,0);ctx.imageSmoothingEnabled=false;
}
addEventListener("resize",resize);resize();

// ---------- sprites ----------
function sprite(rows,pal){const c=document.createElement("canvas");c.width=rows[0].length;c.height=rows.length;const x=c.getContext("2d");
  rows.forEach((r,y)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=="."&&pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}});return c}
function rot(s){const c=document.createElement("canvas");c.width=s.height;c.height=s.width;const x=c.getContext("2d");x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(s,0,0);return c}

const CAN=sprite([".gggg.","wwwwww","rrrrrr","ryyrrr","rrrrrr","rrryyr","rrrrrr","wwwwww",".gggg."],{g:"#7c7c7c",w:"#bcbcbc",r:"#d82800",y:"#fcfcfc"});
const SMALL=sprite([".ddd.",".lgl.",".lgl.","lgggl","lgggl","wwwww","wrrrw","wwwww","lgggl","lgggl","lgggl",".ggg."],{d:"#005800",l:"#b8f818",g:"#00a800",w:"#fcfcfc",r:"#d82800"});
const BIG=sprite(["..bbb..","..bbb..","..ccc..","..clc..",".ccccc.","cclcccc","clccccc","yyyyyyy","yoyyoyy","yyyyyyy","clccccc","clccccc","clccccc","clccccc","clccccc",".ccccc."],{b:"#0058f8",c:"#a4e4fc",l:"#fcfcfc",y:"#f8b800",o:"#d82800"});
const GLASS=sprite([".yyy.",".ddd.",".bdb.",".bdb.","bbddb","bdddb","wwwww","wdwdw","wwwww","bdddb","bdddb","bdddb",".bbb."],{y:"#f8b800",b:"#ac7c00",d:"#503000",w:"#fcd8a8"});
const TYPES=[{p:0.15,s:CAN},{p:0.20,s:SMALL},{p:0.40,s:BIG},{p:0.10,s:GLASS}].map(t=>({...t,r:rot(t.s)}));

const TRASH=[
  sprite(["y.....y.","yy...yy.",".yy.yy..","..yyy...","..yby...","...b...."],{y:"#f8b800",b:"#503000"}),
  sprite([".ww.ww.","wwlwwlw","wlwwwww","wwwlwlw","lwwwwww",".wl.ww."],{w:"#fcfcfc",l:"#bcbcbc"}),
  sprite(["bbbbbb","bbbbbb","byyyyb","byrryb","byyyyb","bbbbbb","bbbbbb","b.bb.b"],{b:"#0058f8",y:"#f8b800",r:"#d82800"})
];

// office people (intro)
const PTOP=["..hhhh..",".hhhhhh.",".hskssk.",".ssssss.","..ssss..","..cccc..",".cccccc.","cccccccc","sccccccs","sccccccs",".cccccc.",".pppppp."];
const P_STAND=PTOP.concat([".pp..pp.",".pp..pp.",".pp..pp.","bbb..bbb"]);
const P_WALK=PTOP.concat(["..pppp..","..pp.pp.",".pp...pp","bb....bb"]);
const LOOKS=[["#503000","#d82800"],["#f8b800","#0058f8"],["#000000","#00a800"],["#ac7c00","#6844fc"]];
function personPal(i){const [h,c]=LOOKS[i%LOOKS.length];return {h,c,s:"#fcd8a8",k:"#000000",p:"#24188c",b:"#3c3c3c"}}
const PEOPLE=LOOKS.map((_,i)=>({stand:sprite(P_STAND,personPal(i)),walk:sprite(P_WALK,personPal(i))}));
const PLAYER={stand:sprite(P_STAND,{h:"#ac7c00",c:"#fcfcfc",s:"#fcd8a8",k:"#000",p:"#3c3c3c",b:"#000"})};

// customers: two frames each (stand / step)
const SK="#fcd8a8";
function legs(w8,a){return a?[".pp..pp.",".pp..pp.",".pp..pp.","bbb..bbb"]:["..pppp..","..pp.pp.",".pp...pp","bb....bb"]}
function cust(top,pal){return {a:sprite(top.concat(legs(8,true)),pal),b:sprite(top.concat(legs(8,false)),pal)}}
const C_SUIT=cust(["..hhhh..",".hhhhhh.",".hesse..".replace("..","h."),".ssssss.","..ssss..","..cwtc..",".ccwtcc.","cccwtccc","sccctccs","sccccccs",".cccccc.",".pppppp."],
  {h:"#000000",s:SK,e:"#000000",c:"#3c3c3c",w:"#fcfcfc",t:"#0058f8",p:"#3c3c3c",b:"#000000"});
const C_OLD=cust(["..ssss..",".lssssl.",".lgssgl.",".ssssss.","..slls..","..cccc..",".cccccc.","cccccccc","sccccccs",".cccccc.",".cccccc.",".pppppp."],
  {s:SK,l:"#bcbcbc",g:"#000000",c:"#ac7c00",p:"#7c7c7c",b:"#503000"});
const C_PULI=cust(["..rrrr..",".rrrrrr.",".rrrrrr.",".sesses.",".dssssd.",".dddddd.","..dddd..",".oooooo.","oooooooo","soooooos",".oooooo.",".oooooo."],
  {r:"#d82800",s:SK,e:"#000000",d:"#7c7c7c",o:"#005800",p:"#503000",b:"#000000"});
const C_STUD=cust(["..wwww..",".wwwwww.",".kkkkkk.",".sesses.","..ssss..","..cccc..",".cccccc.","cccccccc","sccccccs","sccccccs",".cccccc.",".pppppp."],
  {w:"#fcfcfc",k:"#000000",s:SK,e:"#000000",c:"#fc9838",p:"#0058f8",b:"#fcfcfc"});
const C_COLL=cust(["..gggg..",".gggggg.","gggggggg",".sesses.",".ssssss.","..ssss..",".yywwyy.","yyywwyyy","syyyyyys","syyyyyys",".wwwwww.",".pppppp."],
  {g:"#00a800",s:SK,e:"#000000",y:"#f8b800",w:"#fcfcfc",p:"#24188c",b:"#503000"});
const KIDTOP=[".hhhh.","hhhhhh","hseseh",".ssss.",".cccc.","cccccc","sccccs",".cccc."];
const C_KID={a:sprite(KIDTOP.concat([".p..p.",".p..p.","bb..bb"]),{h:"#f8b800",s:SK,e:"#000",c:"#f878f8",p:"#0058f8",b:"#d82800"}),
             b:sprite(KIDTOP.concat(["..pp..",".p..p.","b....b"]),{h:"#f8b800",s:SK,e:"#000",c:"#f878f8",p:"#0058f8",b:"#d82800"})};
const BAG=sprite([".w..w.",".w..w.","wwwwww","wlwwww","wwwwlw","wwwwww",".wwww."],{w:"#fcfcfc",l:"#bcbcbc"});
const BIGBAG=sprite(["..k..k..","..k..k..","kkkkkkkk","kgkkkkkk","kkkkkgkk","kkkkkkkk","kkgkkkkk","kkkkkkkk",".kkkkkk."],{k:"#3c3c3c",g:"#7c7c7c"});
const KINDS={
  suit:{n:1,spr:C_SUIT,h:16,bag:null,name:"SUIT"},
  old:{n:3,spr:C_OLD,h:16,bag:BAG,cane:true,name:"GRANDPA"},
  puli:{n:5,spr:C_PULI,h:16,bag:BAG,name:"BUM"},
  stud:{n:8,spr:C_STUD,h:16,bag:BAG,name:"STUDENT"},
  kid:{n:10,spr:C_KID,h:11,bag:BIGBAG,name:"KID"},
  coll:{n:15,spr:C_COLL,h:16,bag:BIGBAG,name:"COLLECTOR"}
};

// boss
const BTOP=["...ssssss...","..gssssssg..","..gssssssg..","..skssssks..","..ssssssss..","..smmmmmms..","...sssssccy.","....ssss....",
  "..dddwrddd..",".ddddwrdddd.","ddddddrddddd","sdddddrdddds","sdddddddddds",".dddddddddd.",".dddddddddd.","..dddddddd.."];
const BLEG_A=["..ddd..ddd..","..ddd..ddd..","..ddd..ddd..",".bbbb..bbbb."];
const BLEG_B=["...ddd.ddd..","..ddd...ddd.",".ddd....ddd.","bbbb....bbbb"];
const BANGRY=BTOP.slice();BANGRY[1]="..gkksskkg..";BANGRY[5]="..smkkkkms..";
const BPAL={g:"#bcbcbc",s:"#fcd8a8",k:"#000000",m:"#503000",c:"#ac7c00",y:"#fc9838",d:"#24188c",w:"#fcfcfc",r:"#d82800",b:"#000000"};
const BOSS_A=sprite(BTOP.concat(BLEG_A),BPAL),BOSS_B=sprite(BTOP.concat(BLEG_B),BPAL),BOSS_X=sprite(BANGRY.concat(BLEG_A),BPAL);
// union rep Riitta
const UTOP=["...hh...","..hhhh..",".hhhhhh.",".hskssk.",".ssssss.","..ssss..","..rwwr..",".rrwwrr.","rrrwwrrr","srrwwrrs","srrrrrrs",".pppppp."];
const UPAL={h:"#503000",s:SK,k:"#000000",r:"#d82800",w:"#fcfcfc",p:"#24188c",b:"#000000"};
const UNION=sprite(UTOP.concat([".pp..pp.",".pp..pp.",".pp..pp.","bbb..bbb"]),UPAL);
// office plants
const PLANT=sprite(["..g.g...",".gGgGg..","gGggGgg.",".gGgGGg.","gg.gGg.g","..gGg...","...g....",".pppppp.",".pPPPPp.","..pppp..","..pppp.."],{g:"#00a800",G:"#005800",p:"#c84c0c",P:"#fc9838"});
const SNAKE=sprite(["..g..g..","..g.gg..",".gg.gG.g",".gG.gG.g",".gGggGgg",".gGgGGgG","ggGgGGgG","gGGgGGgG",".pppppp.",".pPPPPp.","..pppp..","..pppp.."],{g:"#b8f818",G:"#00a800",p:"#ac7c00",P:"#f8b800"});
// coffee cup for breaks
const CUP=sprite(["cccccccccccc....","cbbbbbbbbbbc....","cwwwwwwwwwwcccc.","cwwwwwwwwwwc..c.","cwwrrwwrrwwc..c.","cwwrrrrrrwwc..c.","cwwwrrrrwwwcccc.","cwwwwrrwwwwc....",".cwwwwwwwwc.....","..cwwwwwwc......","pppppppppppppp..",".pppppppppppp..."],
  {c:"#bcbcbc",b:"#503000",w:"#fcfcfc",r:"#d82800",p:"#7c7c7c"});
const RTOP=[".....r......",".....g......","..gggggggg..",".gwwwwwwwwg.",".gwrrrrrrwg.",".gwwwwwwwwg.",".gwwkkkkwwg.","..gggggggg..","....gggg....",
  ".gggggggggg.","gwwwwwwwwwwg","gwwbbwwyywwg","gwwbbwwyywwg","gwwwwwwwwwwg",".gggggggggg.","..gg....gg..","..gg....gg..","..gg....gg..",".gggg..gggg.",".kkkk..kkkk."];
const RPAL={r:"#d82800",g:"#7c7c7c",w:"#bcbcbc",k:"#000000",b:"#3cbcfc",y:"#b8f818"};
const ROBOT=sprite(RTOP,RPAL);
const PENTTI_DOWN=rot(BOSS_X);
const MEDIC=cust(["..wwww..",".wwrrww.",".skssks.",".ssssss.","..ssss..","..gggg..",".gggggg.","gggwrggg","sggrrggs","syyyyyys",".gggggg.",".pppppp."],
  {w:"#fcfcfc",r:"#d82800",s:SK,k:"#000000",g:"#00a800",y:"#f8b800",p:"#005800",b:"#000000"});
const PORTRAITS={PENTTI:sprite(BTOP.slice(0,9),BPAL),LIITTO:sprite(UTOP.slice(0,9),UPAL),"AI-9000":sprite(RTOP.slice(1,10),RPAL)};
function drawPortrait(who){const p=document.getElementById("portrait").getContext("2d");p.imageSmoothingEnabled=false;p.clearRect(0,0,12,9);const s=PORTRAITS[who];if(s)p.drawImage(s,R((12-s.width)/2),0)}

// ---------- helpers ----------
const FONT="8px 'Press Start 2P', monospace";
function txt(s,x,y,col,align){ctx.font=FONT;ctx.textBaseline="top";ctx.textAlign=align||"left";ctx.fillStyle="#000";ctx.fillText(s,x+1,y+1);ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.textAlign="left"}
function txtHL(str,cx,y,col,hi,from,len){const x0=R(cx-str.length*4);for(let i=0;i<str.length;i++)txt(str[i],x0+i*8,y,i>=from&&i<from+len?hi:col)}
function box(x,y,w,h){ctx.fillStyle="#fcfcfc";ctx.fillRect(x,y,w,h);ctx.fillStyle="#000";ctx.fillRect(x+2,y+2,w-4,h-4)}
function wrap(s,n){const out=[];let line="";for(const w of s.split(" ")){if((line+" "+w).trim().length>n){out.push(line);line=w}else line=(line+" "+w).trim()}if(line)out.push(line);return out}
function fmt(x){return "€"+x.toFixed(2)}
const R=n=>Math.round(n);

// ---------- game rules ----------
const START_MISS=2,TRASH_LIFE=10,BREAK_EVERY=5,REPAIR_TIME=1.5,JAM_LIMIT=6;
const RT=String(REPAIR_TIME);
const QW=34,MW=12;            // queue area width, machine width
const BX=()=>QW+MW;           // belt start x
const BEND=()=>LW-14;         // belt end (worker stands right of it)
const MID=()=>R((BX()+BEND())/2); // halfway point of the belt
const NPCS={jari:{lane:1,who:0,col:"#fc9838",label:"JARI'S"},sari:{lane:2,who:1,col:"#3cbcfc",label:"SARI'S"},mikko:{lane:3,who:2,col:"#b8f818",label:"MIKKO'S"}};
const COFFEE_EVERY=15,COFFEE_LEN=2;
const P="PENTTI",U="LIITTO";
const BOSS={
  10:{fire:"jari",lines:[[P,"JARI! Get over here. The new kid collects bottles twice as fast as you."],[P,"Jari, you're fired. Pack your things."],
      [P,"And you: promotion! You get Jari's line. You now run two lines at once. Same pay, of course."],
      [P,"Your reward: an Employee of the Month sticker. It's from last year, but nobody checks."]]},
  20:{fire:"sari",lines:[[P,"SARI! You dropped more bottles than you caught. You're fired."],
      [P,"Congratulations, another promotion! You take Sari's line. Three lines now."],
      [P,"Your reward: you may use the break room microwave on Tuesdays, 2:10 to 2:15 pm."]]},
  30:{fire:"mikko",lines:[[P,"MIKKO! You fixed one screw all week. You're fired."],
      [P,"And you... you get Mikko's line. You now run ALL four lines. Promotion!"],
      [P,"Your reward: a keychain that says BEST. The rest of the text wore off."]]},
  40:{lines:[[P,"Good news! The cleaning company wanted a raise, so I cancelled the contract."],
      [P,"Cleaning is your job now. Customers drop trash in the queue. Tap it away. If trash sits there for "+TRASH_LIFE+" seconds, it counts as a miss."],
      [P,"Your reward: a free mop. Well, it's the company mop. Don't lose it."]]},
  50:{lines:[[P,"The repair company sent me an invoice. I sent them back a letter saying we have you."],
      [P,"You're the repairman now. A line breaks every "+BREAK_EVERY+" seconds. Fix it by holding your finger on the belt for "+RT+" seconds."],
      [P,"Your reward: a name tag that says HEAD OF EVERYTHING. It's handwritten."]]}
};
const AI="AI-9000",GOAL=25;
BOSS[60]={showdown:true,lines:[[AI,"BEEP. GREETINGS, PENTTI. I AM AI-9000, YOUR NEW REGIONAL MANAGER."],
  [AI,"EFFICIENCY ANALYSIS COMPLETE. PENTTI: 3 PERCENT. MOSTLY SHOUTING AND CIGARS."],
  [AI,"NEW ROLE ASSIGNED: BOTTLE BOY. ALSO: CIGARS ARE DEPRECATED."],
  [P,"WHAT?! I built this department! I gave the AI its job! This is betrayal!"],
  [AI,"FINAL TEST. BOTH UNITS COLLECT BOTTLES. FIRST TO "+GOAL+" KEEPS THE JOB. THE OTHER IS... OPTIMIZED."],
  [P,"Fine. Two lines for you, two for me. Old Pentti still has the fastest hands in SS-Market. Let's go, kid!"]]};
const WIN_LINES=[[P,"I... can't... keep... up... my... heart..."],["","Pentti collapses between the bottle crates. Forty years of cigars and shouting finally caught up with him."],
  [AI,"UNIT PENTTI: OFFLINE. CAUSE: WORK."],[AI,"NEW MANAGER APPOINTED: BOTTLE BOY. CONGRATULATIONS. YOUR SALARY REMAINS THE SAME."]];

// ---------- customers ----------
function pickKind(){
  const s=prog();
  const w=[["suit",3*Math.max(0.25,1-s/30)],["old",3*Math.max(0.4,1-s/40)],["puli",s>=3?2.2:1],["kid",s>=5?1.6+s*0.02:0.5]];
  if(s>=8)w.push(["stud",1.5+s*0.03]);
  if(s>=18)w.push(["coll",1+(s-18)*0.06]);
  let tot=w.reduce((a,b)=>a+b[1],0),r=Math.random()*tot;
  for(const [k,v] of w){if((r-=v)<=0)return k}return "puli";
}
function queueSlots(){const out=[];for(let y=LH-18;y>=wallH()+4;y-=17){out.push([12,y]);out.push([2,y])}return out}
function activeSlot(li){const b=belts()[li],k=st.active[li]?KINDS[st.active[li].kind]:null;return [QW-11,b.y+b.h+2-(k?k.h:16)]}
function fillQueue(instant){
  const slots=queueSlots(),target=Math.min(slots.length,3+Math.floor(prog()/3));
  while(st.queue.length<target){const kind=pickKind(),[x,y]=slots[Math.min(st.queue.length,slots.length-1)];
    st.queue.push({kind,left:KINDS[kind].n,open:0,x:instant?x:-10,y:instant?y:y,done:false})}
}
function stepCustomers(dt){
  fillQueue(false);
  for(let li=0;li<st.lines;li++){if(!st.active[li]&&st.queue.length){const c=st.queue.shift();c.state="moving";st.active[li]=c;c.line=li}}
  const slots=queueSlots();
  const move=(c,tx,ty)=>{const dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),sp=50*dt;if(d<=sp){c.x=tx;c.y=ty;return true}c.x+=dx/d*sp;c.y+=dy/d*sp;c.walking=true;return false};
  st.queue.forEach((c,i)=>{c.walking=false;const s=slots[Math.min(i,slots.length-1)];move(c,s[0],s[1])});
  for(let li=0;li<st.lines;li++){const c=st.active[li];if(!c)continue;c.walking=false;const [tx,ty]=activeSlot(li);if(move(c,tx,ty))c.state="dumping"}
  for(const c of st.leaving){c.walking=true;c.x-=40*dt}
  st.leaving=st.leaving.filter(c=>c.x>-12);
}
function resolve(c){if(!c||c.done)return;c.open--;if(c.left<=0&&c.open<=0){c.done=true;st.served++;updateHud();
  st.fx.push({x:30,y:wallH()+4,t:1,s:"THANKS!",c:"#b8f818"});checkBoss()}}
function spawn(li){
  const L=st.L[li],c=st.active[li];
  if(!c||c.state!=="dumping"||c.left<=0)return false;
  c.left--;c.open++;L.flash=0.15;
  if(c.left<=0){st.active[li]=null;c.state="leaving";st.leaving.push(c)}
  if(L.broken&&st.bottles.filter(b=>b.line===li).length>=JAM_LIMIT){miss(BX()+20,belts()[li].y-12,"JAMMED!");resolve(c);return true}
  const r=Math.random(),t=r<0.4?TYPES[0]:r<0.7?TYPES[1]:r<0.88?TYPES[3]:TYPES[2];
  st.bottles.push({t,x:BX()+3,line:li,c,lying:Math.random()<0.25,mid:false});
  return true;
}
function miss(x,y,t){sfx("miss");st.missed++;st.fx.push({x,y,t:1.2,s:t,c:"#d82800"});updateHud()}
function spawnTrash(){
  const bs=belts();
  for(let k=0;k<25;k++){
    const x=1+Math.random()*(QW-11),y=wallH()+4+Math.random()*(LH-wallH()-14);
    if(st.trash.some(t=>Math.abs(t.x-x)<12&&Math.abs(t.y-y)<12))continue;
    st.trash.push({x:R(x),y:R(y),age:0,k:Math.floor(Math.random()*3)});return;
  }
}
function updateHud(){
  document.getElementById("hMoney").textContent=fmt(st.money);
  document.getElementById("hServed").textContent=st.served;
  const mx=st.maxMiss,m=Math.min(st.missed,mx),w=mx<=4?8:mx<=8?6:4;let h="";
  if(mx>16){const left=mx-m;h='<i style="width:'+R(48*left/mx)+'px"></i><i class="off" style="width:'+(48-R(48*left/mx))+'px;margin-left:-2px"></i><span class="v" style="font-size:9px;margin-left:4px">'+left+'</span>'}
  else for(let i=0;i<mx;i++)h+='<i style="width:'+w+'px" class="'+(i<mx-m?"":"off")+'"></i>';
  document.getElementById("hLives").innerHTML=h;
}
function clearBelts(){
  // wipe every bottle off the belts so the next stage starts empty
  for(const b of st.bottles){const c=b.c;if(c&&!c.done){c.open--;if(c.left<=0&&c.open<=0){c.done=true;st.served++}}}
  st.bottles=[];st.L.forEach(L=>{L.spawnT=1.2+Math.random()*0.6;L.broken=false;L.repair=0});hold=null;updateHud();
}

function MILESTONES(){return [[20,10],[40,20],[60,30],[80,40],[100,50],[120,60]]}

function makeDiffRow(){const r=document.createElement("div");r.className="row diffrow";const l=document.createElement("span");l.className="difflabel";l.textContent="DIFFICULTY";r.appendChild(l);
  ["loser","normal"].forEach(d=>{const b=document.createElement("button");b.type="button";b.className="btn small diffbtn";b.dataset.d=d;b.textContent=d.toUpperCase();b.setAttribute("aria-pressed",String(DIFF===d));b.addEventListener("click",()=>setDiff(d));r.appendChild(b)});return r}

function levelNow(){let n=1;for(const [at,k] of MILESTONES())if(st.shown[k])n++;return n}
function checkBoss(){
  for(const [at,k] of MILESTONES()){
    if(st.served>=at&&!st.shown[k]){
      st.shown[k]=true;
      const ev=BOSS[k];
      mode="pause";hold=null;st.angry=null;if(ev.showdown){st.robot=true;st.coffee=0}
      say(ev.lines,()=>{
        if(ev.fire||ev.showdown)clearBelts();
        if(ev.showdown||k===40||k===50){st.missed=0;st.maxMiss*=2;updateHud();st.fx.push({x:R(LW/2),y:wallH()+24,t:2,s:"MISSES x2!",c:"#b8f818"})}
        if(ev.fire){const n=st.npc[ev.fire];n.st="leave";st.missed=0;st.maxMiss*=2;updateHud();st.fx.push({x:R(LW/2),y:wallH()+6,t:2,s:"MISSES x2!",c:"#b8f818"});st.owner[NPCS[ev.fire].lane]="you";
          st.bottles.forEach(b=>{if(b.line===NPCS[ev.fire].lane)b.mid=b.x>MID()})}
        if(k===40){st.trashOn=true;st.trashT=1.5}
        if(k===50){st.maint=true;st.breakT=2}
        if(k===60)startShowdown();
        mode="play";
      });return;
    }
  }
}

function startIntro(){
  const fy=R(Math.max(68,LH*0.3));
  intro={i:0,wait:0,fy,bossX:LW+14,bossWalk:false,leaving:false,
    desks:[{x:R(LW*0.27),y:fy+16,who:0},{x:R(LW*0.73),y:fy+16,who:1},{x:R(LW*0.27),y:fy+50,who:2},{x:R(LW*0.73),y:fy+50,who:-1}],
    walkers:[]};
  mode="intro";document.getElementById("title").hidden=true;document.getElementById("skip").hidden=false;nextStep();
}
function nextStep(){
  if(mode!=="intro")return;
  const s=STEPS[intro.i++];if(!s)return;
  if(s.wait){intro.wait=s.wait}
  else if(s.say){say(s.say,nextStep)}
  else if(s.act==="bossIn"){intro.bossWalk=true}
  else if(s.act==="leave"){intro.leaving=true;intro.walkers=intro.desks.filter(d=>d.who!==-2).map(d=>({x:d.x-4,y:d.y-12,who:d.who,delay:d.who<0?0.9:Math.random()*0.5}));intro.desks.forEach(d=>{d.who=-2})}
  else if(s.act==="start"){startLogo()}
}
function stepIntro(dt){
  if(intro.wait>0){intro.wait-=dt;if(intro.wait<=0)nextStep()}
  if(intro.bossWalk){intro.bossX-=dt*28;const tx=R(LW/2-6);if(intro.bossX<=tx){intro.bossX=tx;intro.bossWalk=false;nextStep()}}
  if(intro.leaving){
    let all=true;for(const w of intro.walkers){if(w.delay>0){w.delay-=dt;all=false;continue}w.x-=dt*34;if(w.x>-12)all=false}
    if(all){intro.leaving=false;nextStep()}
  }
}

// ---------- final showdown ----------
NPCS.pentti={col:"#d82800",label:"PENTTI'S"};
function startShowdown(){
  st.union=false;st.coffee=0;st.robot=true;st.angry=null;
  st.owner=["you","you","pentti","pentti"];
  for(const i of [2,3]){st.L[i].broken=false;st.L[i].repair=0}
  st.bottles.forEach(b=>{if(b.line>1)b.npcTried=false});
  st.sd={you:0,pentti:0,lane:2,move:0,grab:0,over:false};
}
function stepShowdown(dt){
  const d=st.sd;if(!d||d.over)return;
  if(d.grab>0)d.grab-=dt;if(d.move>0)d.move-=dt;
  const tired=Math.min(0.45,d.pentti*0.016);
  let tgt=null;for(const b of st.bottles)if(b.line>1&&!b.npcTried&&b.x>=BEND()-14&&(!tgt||b.x>tgt.x))tgt=b;
  if(tgt&&tgt.line!==d.lane&&d.move<=0){d.lane=tgt.line;d.move=0.18+tired*0.5}
  if(tgt&&tgt.line===d.lane&&d.move<=0&&d.grab<=0&&tgt.x>=BEND()-6){tgt.npcTried=true;
    if(Math.random()<0.93-tired){tgt.gone=true;d.pentti++;d.grab=0.22+tired;st.fx.push({x:LW-24,y:belts()[tgt.line].y-10,t:0.7,s:"+1",c:"#d82800"});resolve(tgt.c)}
    else{d.grab=0.5;st.fx.push({x:LW-40,y:belts()[tgt.line].y-10,t:1,s:"ARGH!",c:"#d82800"})}}
  if(d.you>=GOAL)finishShowdown(true);else if(d.pentti>=GOAL)finishShowdown(false);
}
function finishShowdown(win){
  const d=st.sd;d.over=true;d.win=win;mode="pause";hold=null;
  if(win){startCut();return}
  say(LOSE_LINES,()=>endGame("lose"));
}

function step(dt){

    if(L.spawnT<=0){spawn(li);L.spawnT=spawnInterval()*(0.6+Math.random()*0.8)*1.3}}
  st.angryCd-=dt;if(st.tapT>0)st.tapT-=dt;
  for(const b of st.bottles){if(!st.L[b.line].broken){b.x+=v*dt;
    if(!b.mid&&b.x>MID()&&mine(b.line)){b.mid=true;if(st.angryCd<=0&&!st.angry&&!st.sd){sfx("crack");st.angry={t:2.8,line:b.line,s:SHOUTS[Math.floor(Math.random()*SHOUTS.length)]};st.angryCd=8}}}}
  // coworkers grab bottles at the end of their own lines
  for(const k in st.npc){const n=st.npc[k],cfg=NPCS[k];if(n.grab>0)n.grab-=dt;if(n.st!=="work")continue;
    for(const b of st.bottles){if(b.line!==cfg.lane||b.npcTried||b.x<BEND()-6||n.grab>0)continue;b.npcTried=true;
      if(Math.random()<0.8){b.gone=true;n.grab=0.3;st.fx.push({x:LW-24,y:bs[cfg.lane].y-10,t:0.7,s:"+",c:cfg.col});resolve(b.c)}
      else{n.grab=0.4;st.fx.push({x:LW-34,y:bs[cfg.lane].y-10,t:1,s:"OOPS!",c:cfg.col})}}}
  st.bottles=st.bottles.filter(b=>{if(b.gone)return false;
    if(b.x>BEND()+4){if(!mine(b.line))resolve(b.c);else{miss(LW-24,bs[b.line].y-10,"MISS!");resolve(b.c)}return false}return true});
  for(const k in st.npc){const n=st.npc[k];if(n.st==="leave"){n.x+=dt*24;if(n.x>LW+12)n.st="gone"}}
  // union coffee breaks
  if(st.union){if(st.coffee>0)st.coffee-=dt;else{st.coffeeT-=dt;if(st.coffeeT<=0){sfx("break");st.coffee=COFFEE_LEN;st.coffeeT=COFFEE_EVERY;if(hold){const L=st.L[hold.line];L.repair=0;hold=null}}}}
  if(st.angry){st.angry.t-=dt;if(st.angry.t<=0)st.angry=null}
  if(st.trashOn){st.trashT-=dt;if(st.trashT<=0){if(st.trash.length<8)spawnTrash();st.trashT=trashEvery()}
    for(const t of st.trash)t.age+=dt;
    st.trash=st.trash.filter(t=>{if(t.age>=TRASH_LIFE){miss(t.x+4,t.y-10,"MESS!");return false}return true})}
  if(st.maint){st.breakT-=dt;
    if(st.breakT<=0){st.breakT=BREAK_EVERY;const ok=[];for(let i=0;i<st.lines;i++)if(!st.L[i].broken&&mine(i))ok.push(i);
      if(ok.length){const i=ok[Math.floor(Math.random()*ok.length)];st.L[i].broken=true;st.L[i].repair=0}}
    if(hold){const L=st.L[hold.line];if(L.broken){L.repair+=dt;if(L.repair>=REPAIR_TIME){L.broken=false;L.repair=0;sfx("fix");st.fx.push({x:hold.x,y:bs[hold.line].y-12,t:1.2,s:"FIXED!",c:"#b8f818"});hold=null}}else hold=null}}

}

  const kinds=["suit","old","puli","kid"];kinds.forEach((k,i)=>{const s=KINDS[k];ctx.drawImage(Math.floor(T*2+i)%2?s.spr.a:s.spr.b,R(LW/2-44+i*11),by+64-s.h)});
  ctx.drawImage(Math.floor(T*2)%2?BOSS_A:BOSS_B,R(LW/2+20),by+44);
  txtHL("TASSTE OF LIFE",R(LW/2),by+72,"#7c7c7c","#ac7c00",1,3);txt("STUDIOS © 2026",R(LW/2),by+82,"#7c7c7c","center");
}

function draw(){
  ctx.clearRect(0,0,LW,LH);
  if(mode==="title")drawTitle();
  else if(mode==="intro")drawIntro();
  else if(mode==="logo")drawLogo();
  else drawPlay();
}
function loop(ts){
  const dt=Math.max(0,Math.min(0.05,(ts-last)/1000||0));last=ts;T+=dt;
  tickDlg(dt);
  if(mode==="intro")stepIntro(dt);
  if(mode==="play")step(dt);
  if(mode==="pause"&&st&&st.sd&&st.sd.cut){stepCut(dt);for(const f of st.fx){f.t-=dt}}
  if(mode==="logo"){logo.t+=dt;if(logo.t>=LOGO_LEN)startGame()}
  draw();requestAnimationFrame(loop);
}

// ---------- input ----------
function pt(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S}}
cv.addEventListener("pointerdown",e=>{
  if(mode==="logo"){e.preventDefault();if(logo.t>1)startGame();return}
  if(mode!=="play")return;e.preventDefault();
  if(st.coffee>0)return;
  const {x:px,y:py}=pt(e),bs=belts();
  let ti=-1,td=1e9;st.trash.forEach((t,i)=>{const cx=t.x+4,cy=t.y+4,d=Math.hypot(px-cx,py-cy);if(d<10&&d<td){td=d;ti=i}});
  if(ti>=0){const t=st.trash.splice(ti,1)[0];sfx("clean");st.fx.push({x:t.x+4,y:t.y-8,t:0.8,s:"CLEAN",c:"#b8f818"});return}
  let best=null,bd=1e9;
  for(const b of st.bottles){if(!mine(b.line))continue;const s=b.lying?b.t.r:b.t.s,bl=bs[b.line];const cx=b.x,cy=bl.y+bl.h-3-s.height/2;
    const dx=Math.abs(px-cx),dy=Math.abs(py-cy);if(dx<s.width/2+5&&dy<s.height/2+6){const d=dx+dy;if(d<bd){bd=d;best=b}}}
  if(best){st.bottles.splice(st.bottles.indexOf(best),1);st.playerLine=best.line;st.tapT=0.2;sfx("pick");if(st.sd&&!st.sd.over)st.sd.you++;st.money+=best.t.p;st.collected++;
    st.fx.push({x:best.x,y:bs[best.line].y-14,t:0.9,s:"+"+best.t.p.toFixed(2),c:"#fcfcfc"});updateHud();resolve(best.c);return}
  for(let i=0;i<st.lines;i++){const b=bs[i];if(st.L[i].broken&&mine(i)&&px>BX()&&px<BEND()+4&&py>b.y-8&&py<b.y+b.h+8){hold={line:i,id:e.pointerId,x:px};try{cv.setPointerCapture(e.pointerId)}catch(_){}return}}
});
function release(e){if(hold&&e.pointerId===hold.id){const L=st.L[hold.line];if(L.broken)L.repair=0;hold=null}}

addEventListener("contextmenu",e=>e.preventDefault());



// ---------- "BOTTLE BOY" logo reveal with fanfare ----------
const LOGO_LEN=4.6;let logo={t:0};
function startLogo(){
  mode="logo";logo={t:0};intro=null;dlg=null;dEl.hidden=true;
  ["title","end","skip"].forEach(id=>document.getElementById(id).hidden=true);
  fanfare();
}
function fanfare(){
  const c=SND.ctx;if(!c||SND.muted)return;const t0=c.currentTime+0.08;
  const N=(m,at,d,v,type)=>tone(type||"square",hz(m),t0+at,d,v||0.45);
  // timpani roll building up
  for(let i=0;i<12;i++)tone("triangle",hz(43),t0+i*0.03,0.06,0.2+i*0.04);
  // phrase 1: rising arpeggio into a held high G
  N(67,0.40,0.12);N(72,0.52,0.12);N(76,0.64,0.12);N(79,0.76,0.55);N(64,0.76,0.55,0.18);N(48,0.76,0.6,0.7,"triangle");
  hat(t0+0.76,0.6,0.15);
  // phrase 2: stepping down and back up
  N(77,1.40,0.14);N(76,1.56,0.14);N(74,1.72,0.14);N(76,1.88,0.40);N(69,1.88,0.40,0.18);N(45,1.40,0.9,0.7,"triangle");
  // phrase 3: run up to the big final chord
  N(72,2.36,0.1);N(74,2.46,0.1);N(76,2.56,0.1);N(79,2.66,0.12);
  [84,79,76,72].forEach((m,i)=>N(m,2.80,1.5,i?0.2:0.5));N(36,2.80,1.6,0.8,"triangle");N(48,2.80,1.6,0.5,"triangle");
  for(let i=0;i<4;i++)hat(t0+2.80+i*0.09,0.7-i*0.12,0.2);
  for(let i=0;i<10;i++)tone("triangle",hz(43),t0+2.80+i*0.035,0.06,0.5-i*0.03);
}
function drawLogo(){
  const t=logo.t,cx=R(LW/2),cy=R(LH*0.38);
  ctx.fillStyle="#000";ctx.fillRect(0,0,LW,LH);
  // rotating rays after the big chord
  if(t>2.85){ctx.save();ctx.translate(cx,cy+18);ctx.rotate(t*0.6);
    for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.fillStyle=i%2?"#24188c":"#0058f8";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-18,-LH);ctx.lineTo(18,-LH);ctx.closePath();ctx.fill()}
    ctx.restore()}
  // "BOTTLE": letters drop in one by one
  ctx.font="16px 'Press Start 2P', monospace";ctx.textBaseline="top";
  const word="BOTTLE",w=word.length*16,x0=cx-w/2;
  for(let i=0;i<word.length;i++){const lt=t-0.4-i*0.12;if(lt<0)continue;
    const p=Math.min(1,lt/0.25),bounce=p<1?(1-p)*-40:Math.max(0,Math.sin((lt-0.25)*20)*3*Math.max(0,1-(lt-0.25)*3));
    const y=R(cy-24+bounce);ctx.fillStyle="#d82800";ctx.fillText(word[i],x0+i*16+2,y+2);ctx.fillStyle="#f8b800";ctx.fillText(word[i],x0+i*16,y)}
  // "BOY": zooms in big
  if(t>1.4){const p=Math.min(1,(t-1.4)/0.9),sc=2+(1-p)*3;
    ctx.save();ctx.translate(cx,cy+18);ctx.scale(sc,sc);ctx.textAlign="center";ctx.textBaseline="middle";ctx.globalAlpha=Math.min(1,p*1.5);
    ctx.fillStyle="#d82800";ctx.fillText("BOY",1,1);ctx.fillStyle="#fcfcfc";ctx.fillText("BOY",0,0);ctx.restore();ctx.globalAlpha=1;ctx.textAlign="left"}
  // bottles flanking the logo
  if(t>2.85){ctx.drawImage(BIG,cx-62,cy+8);ctx.drawImage(BIG,cx+55,cy+8)}
  // sparkles
  if(t>2.85)for(let i=0;i<14;i++){const a=i*2.39+t*0.8,r=30+((i*37+Math.floor(t*6))%40);const sx=R(cx+Math.cos(a)*r*1.3),sy=R(cy+18+Math.sin(a)*r);
    if((i+Math.floor(t*8))%3)continue;ctx.fillStyle="#fcfcfc";ctx.fillRect(sx-1,sy,3,1);ctx.fillRect(sx,sy-1,1,3)}
  // white flash on the big chord
  if(t>2.8&&t<3.1){ctx.fillStyle="rgba(252,252,252,"+(1-(t-2.8)/0.3)+")";ctx.fillRect(0,0,LW,LH)}
  if(t>3.2&&Math.floor(t*3)%2)txt("GET READY!",cx,cy+52,"#fcfcfc","center");
  if(t>3.2){const y=R(LH*0.06);txtHL("TASSTE OF LIFE",cx,y,"#bcbcbc","#fc9838",1,3);txt("STUDIOS",cx,y+10,"#bcbcbc","center");txt("PRESENTS",cx,y+20,"#7c7c7c","center")}
}

// ---------- chiptune music & sound effects ----------
// An original, relentlessly cheerful 4-bar loop. Tempo follows how many bottles are on the belts.
const SND={ctx:null,master:null,muted:false,step:0,next:0,bpm:120,timer:null,noise:null};
try{SND.muted=localStorage.getItem("bottlereturn.muted")==="1"}catch(e){}
const _=0;
const MEL=[72,_,76,_,79,_,76,_,84,_,79,_,76,_,79,_, 77,_,81,_,84,_,81,_,77,_,81,_,84,_,86,_,
           76,_,79,_,84,_,79,_,76,_,74,_,72,_,74,_, 79,_,_,79,81,_,83,_,84,_,_,_,79,_,_,_];
const HARM=[64,_,_,_,67,_,_,_,64,_,_,_,67,_,_,_, 65,_,_,_,69,_,_,_,65,_,_,_,69,_,_,_,
            64,_,_,_,67,_,_,_,64,_,_,_,67,_,_,_, 67,_,_,_,71,_,_,_,72,_,_,_,71,_,_,_];
const ROOTS=[48,53,48,43];
const hz=m=>440*Math.pow(2,(m-69)/12);
function audioInit(){
  if(SND.ctx){if(SND.ctx.state==="suspended")SND.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{SND.ctx=new AC()}catch(e){return}
  SND.master=SND.ctx.createGain();SND.master.gain.value=SND.muted?0:0.13;SND.master.connect(SND.ctx.destination);
  const len=SND.ctx.sampleRate*0.2,buf=SND.ctx.createBuffer(1,len,SND.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;SND.noise=buf;
  SND.next=SND.ctx.currentTime+0.1;SND.timer=setInterval(schedule,25);
}
function tone(type,f,t,dur,vol,slideTo){
  const c=SND.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(SND.master);o.start(t);o.stop(t+dur+0.02);
}
function hat(t,vol,dur){const c=SND.ctx,src=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();src.buffer=SND.noise;f.type="highpass";f.frequency.value=6000;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);src.connect(f);f.connect(g);g.connect(SND.master);src.start(t);src.stop(t+dur+0.02)}
function targetBpm(){
  if(!st||mode==="title")return 112;
  if(mode==="intro")return 108;
  if(mode==="over"||mode==="logo")return 0;
  if(st.coffee>0)return 70;
  if(st.sd&&st.sd.cut)return 0;
  return Math.min(250,128+st.bottles.length*7+prog()*0.6);
}
function schedule(){
  const c=SND.ctx;if(!c||c.state!=="running")return;
  const tb=targetBpm();if(!tb){SND.next=c.currentTime+0.05;return}
  SND.bpm+=(tb-SND.bpm)*0.08;
  while(SND.next<c.currentTime+0.12){
    const i=SND.step%64,t=SND.next,sx=60/SND.bpm/4,bar=Math.floor(i/16);
    if(MEL[i])tone("square",hz(MEL[i]),t,sx*1.6,0.5);
    if(HARM[i])tone("square",hz(HARM[i]),t,sx*3,0.16);
    if(i%2===0){const r=ROOTS[bar]+((i/2)%2?12:0);tone("triangle",hz(r),t,sx*1.8,0.7)}
    if(i%4===2)hat(t,0.25,0.04);
    if(i%8===0&&mode==="play")hat(t,0.45,0.09);
    SND.next+=sx;SND.step++;
  }
}
function sfx(kind){
  const c=SND.ctx;if(!c||SND.muted)return;const t=c.currentTime+0.005;
  if(kind==="pick"){tone("square",988,t,0.05,0.45);tone("square",1319,t+0.05,0.08,0.45)}
  else if(kind==="clean"){tone("square",660,t,0.05,0.35);tone("square",880,t+0.05,0.06,0.35)}
  else if(kind==="miss"){tone("square",220,t,0.25,0.5,70)}
  else if(kind==="fix"){[523,659,784,1047].forEach((f,i)=>tone("square",f,t+i*0.06,0.08,0.4))}
  else if(kind==="crack"){hat(t,0.9,0.12);tone("square",1800,t,0.04,0.3,400)}
  else if(kind==="siren"){tone("square",740,t,0.25,0.25);tone("square",988,t+0.27,0.25,0.25)}
  else if(kind==="flat"){tone("square",1000,t,2.0,0.18)}
  else if(kind==="thud"){tone("triangle",90,t,0.3,0.9,40);hat(t,0.5,0.1)}
  else if(kind==="break"){tone("triangle",392,t,0.2,0.6);tone("triangle",523,t+0.18,0.35,0.6)}
}
function setMuted(m){
  SND.muted=m;try{localStorage.setItem("bottlereturn.muted",m?"1":"0")}catch(e){}
  const b=document.getElementById("mute");b.textContent=m?"♪ OFF":"♪ ON";b.setAttribute("aria-pressed",String(m));b.setAttribute("aria-label",m?"Unmute sound":"Mute sound");
  if(SND.master)SND.master.gain.setTargetAtTime(m?0:0.13,SND.ctx.currentTime,0.02);
}
document.getElementById("mute").addEventListener("click",()=>{audioInit();setMuted(!SND.muted)});
setMuted(SND.muted);
document.addEventListener("visibilitychange",()=>{if(!SND.ctx)return;if(document.hidden)SND.ctx.suspend();else SND.ctx.resume()});

// ---------- flow ----------
